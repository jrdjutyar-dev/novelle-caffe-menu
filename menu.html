*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#150904;color:#f0a94a;font-family:Tahoma,Arial,sans-serif}
.wrap{width:min(100%,760px);margin:auto;padding:22px 16px 110px}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}

.card{

.photo{min-width:0;overflow:hidden;border-left:1px solid #9b5723}

.label{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px 12px}
.ar{display:block;color:#f4ad45;font-size:clamp(24px,5.3vw,36px);font-weight:900;line-height:1.25}
.en{display:block;color:#ce9356;font-size:clamp(15px,3.6vw,22px);letter-spacing:1px;margin-top:8px;direction:ltr}
.card:active{transform:scale(.992)}
.card:focus-visible{outline:3px solid #f4ad45;outline-offset:3px}
.whatsapp{
  position:fixed;z-index:5;left:50%;bottom:14px;transform:translateX(-50%);
  width:min(calc(100% - 28px),730px);padding:17px 18px;border-radius:999px;
  background:#14994a;color:white;text-align:center;text-decoration:none;
  font-size:20px;font-weight:900;box-shadow:0 8px 28px rgba(0,0,0,.35)
}
@media(max-width:480px){
  .wrap{padding-left:14px;padding-right:14px}
  .header h1{font-size:40px}
  .card{grid-template-columns:43% 57%;min-height:128px;border-radius:24px}
  .photo img{min-height:128px}
  .ar{font-size:25px}
  .en{font-size:16px}
}
</style>
