<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novelle Caffè</title><meta name="theme-color" content="#100905"><style>
*{box-sizing:border-box}body{margin:0;background:#100905;color:#fff1d5;font-family:Tahoma,Arial,sans-serif;min-height:100vh}
.wrap{max-width:720px;margin:auto;padding:16px}.hero{text-align:center;padding:20px 4px}.logo{width:min(100%,430px);border-radius:24px;border:1px solid #a76b2e;box-shadow:0 16px 40px #0008}
h1{color:#efb35b;margin:16px 0 4px}.sub{color:#c08b4f;letter-spacing:2px;font-size:12px}.btn{display:block;text-decoration:none;text-align:center;color:#f1b65d;border:1px solid #8f5927;background:linear-gradient(#2b180d,#170d08);border-radius:18px;padding:17px;margin:12px 0;font-size:20px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff1d5;border:1px solid #8f5927;background:linear-gradient(#2b180d,#170d08);border-radius:18px;padding:10px;min-height:108px}
.thumb{width:92px;height:92px;border-radius:14px;object-fit:cover;border:1px solid #9a652f;flex:0 0 92px}.card h2{margin:0;color:#efb35b;font-size:18px}.card small{color:#bd8a50;letter-spacing:1px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.back{color:#efb35b;text-decoration:none;font-weight:700}
.section-hero{width:100%;height:220px;object-fit:cover;border-radius:20px;border:1px solid #8f5927;margin:12px 0 16px}
.list{border:1px solid #8f5927;background:#170d08;border-radius:18px;padding:8px 16px}.row{display:grid;grid-template-columns:1fr auto;gap:14px;padding:13px 3px;border-bottom:1px dotted #684322;font-size:18px}.row:last-child{border-bottom:0}.price{color:#efb35b;font-weight:700}
.wa{display:block;position:sticky;bottom:8px;text-align:center;background:#188a48;color:#fff;text-decoration:none;padding:14px;border-radius:999px;font-weight:700;margin-top:20px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.card{min-height:100px}.thumb{width:86px;height:86px;flex-basis:86px}.section-hero{height:190px}}
</style></head><body><div class="wrap"><div class="hero"><img class="logo" src="logo.jpg" alt="Novelle Caffe"><h1>نوفيلا كافي</h1><div class="sub">ITALIAN COFFEE • EST. 2023</div><a class="btn" href="menu.html">عرض المنيو</a></div></div></body></html>
